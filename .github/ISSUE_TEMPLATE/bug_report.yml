name: Bug report
description: Report a reproducible gluemac problem
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected behavior and exact reproduction steps.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Output of `gluemac -v`.
    validations:
      required: true
  - type: input
    attributes:
      label: System
      description: Distribution, GPU, wlroots and SceneFX versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log
      description: Relevant end of `~/.local/state/gluemac.log`; remove private data.
      render: text
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with the current main branch.
          required: true
        - label: I checked for an existing report.
          required: true
