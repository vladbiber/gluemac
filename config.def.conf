# Appearance

corner_radius  = 10
blur           = false
blur_passes    = 2
blur_radius    = 3
opacity        = 1.0
animations     = true
animation_duration = 320

# How windows appear and disappear: zoom, slide, fade or none
animation_type_open      = zoom
animation_type_close     = zoom
animation_duration_open  = 260
animation_duration_close = 220
zoom_initial_ratio       = 0.86
zoom_end_ratio           = 0.88
# cubic-bezier control points, exactly like CSS: x1,y1,x2,y2
animation_curve_open     = 0.16,1.0,0.3,1.0
animation_curve_close    = 0.42,0.0,0.6,1.0

# space left around a window tiled to an edge or a corner
gap            = 8
border         = 0
border_focus   = 7aa2f7
border_normal  = 2f3549
normal_mode_color = e0af68
unfocused_borders = false
root_color     = 000000

# Desktop

# windows float and overlap, the way they do on a Mac
stacking          = true
# spaces a screen starts with; Mission Control adds and removes them
spaces            = 1
# drag a window to the left or right edge to fill that half, to a corner for
# a quarter, to the top to fill the screen
edge_tiling       = true
# apps see Cmd as Ctrl (Ctrl+Shift in terminals), so Cmd+C copies; Cmd+arrows
# jump to the line ends and Option+arrows move by word
cmd_as_ctrl       = true
terminals         = Alacritty alacritty foot footclient kitty org.wezfurlong.wezterm com.mitchellh.ghostty st-glue xterm org.gnome.Console org.gnome.Ptyxis konsole
# a tap of Cmd on its own opens Mission Control
super_tap_overview = false
# hot corners: any wm: or spawn: action, or none
hot_corner_top_left     = wm:mission_control
hot_corner_top_right    = none
hot_corner_bottom_left  = none
hot_corner_bottom_right = wm:show_desktop
# touchpad travel that moves a whole space; 0 = switch at once
swipe_distance    = 300

# Input

warp_pointer   = true
repeat_rate    = 25
repeat_delay   = 600

# Monitors
#
# One line per output, applied at start and again whenever this file is saved:
#   output = NAME key=value ...
# NAME is what the monitor is called on the wire (eDP-1, DP-1, HDMI-A-1;
# gluemac-msg outputs lists them) or * for every output without its own line.
# Keys: mode=WxH[@Hz] | mode=preferred, pos=X,Y | pos=auto, scale=F,
# transform=normal|90|180|270|flipped|flipped-90|flipped-180|flipped-270,
# enabled=true|false, mirror=NAME | mirror=none, adaptive_sync=true|false.
# A missing key means the default: preferred mode, auto position, scale 1,
# no transform, on, no mirror. The glueqs settings panel writes these lines.
#
# Two screens side by side, the laptop panel scaled:
# output = eDP-1 scale=1.5 pos=0,0
# output = DP-1 mode=2560x1440@144 pos=1280,0
# The projector shows the laptop screen (scaled to fit, black bars if needed):
# output = HDMI-A-1 mirror=eDP-1
# Every screen shows the laptop screen:
# output = * mirror=eDP-1
# A screen that stays off:
# output = DP-2 enabled=false

# Autostart

# the menu bar, dock, notch, Spotlight and Launchpad
autostart = qs -c gluemac-shell

# Macros (configure these more easily from glueqs → GLUEMAC → MACROS)
# macro = rapid_click trigger=shift+r type=click mode=hold button=left cps=20 press=10
# macro = qpo trigger=mod+F9 type=sequence mode=toggle interval=80 press=10 sequence=q,p,o,space
# bind_insert = mod+shift+Escape = macro:stop_all

# Keys
#
# cmd is the Super key, opt is Alt. Only the keys below belong to the desktop;
# every other Cmd shortcut goes to the app as Ctrl.

bind_insert = cmd+space = spawn:qs -c gluemac-shell ipc call spotlight toggle || rofi -show drun
bind_insert = F4 = spawn:qs -c gluemac-shell ipc call launchpad toggle
bind_insert = XF86LaunchB = spawn:qs -c gluemac-shell ipc call launchpad toggle
bind_insert = cmd+shift+percent = spawn:qs -c gluemac-shell ipc call screenshot open
bind_insert = cmd+opt+n = spawn:qs -c gluemac-shell ipc call notificationCenter toggle
bind_insert = cmd+Tab = wm:app_switch
bind_insert = cmd+shift+ISO_Left_Tab = wm:app_switch_prev
bind_insert = cmd+grave = wm:app_window_next
bind_insert = cmd+q = wm:quit_app
bind_insert = cmd+h = wm:hide_app
bind_insert = cmd+opt+h = wm:hide_others
bind_insert = cmd+m = wm:minimize
bind_insert = ctrl+cmd+f = wm:toggle_real_fullscreen
bind_insert = ctrl+cmd+q = spawn:qs -c gluemac-shell ipc call lock lock || swaylock -f
bind_insert = cmd+shift+q = wm:quit
bind_insert = ctrl+opt+cmd+r = wm:reload
bind_insert = ctrl+opt+cmd+t = spawn:alacritty
# Spaces and Mission Control
bind_insert = ctrl+Left = wm:space_prev
bind_insert = ctrl+Right = wm:space_next
bind_insert = ctrl+Up = wm:mission_control
bind_insert = ctrl+Down = wm:app_expose
bind_insert = F3 = wm:mission_control
bind_insert = XF86LaunchA = wm:mission_control
bind_insert = cmd+F3 = wm:show_desktop
bind_insert = F11 = wm:show_desktop
bind_insert = ctrl+1 = wm:workspace:1
bind_insert = ctrl+2 = wm:workspace:2
bind_insert = ctrl+3 = wm:workspace:3
bind_insert = ctrl+4 = wm:workspace:4
bind_insert = ctrl+5 = wm:workspace:5
bind_insert = ctrl+6 = wm:workspace:6
bind_insert = ctrl+7 = wm:workspace:7
bind_insert = ctrl+8 = wm:workspace:8
bind_insert = ctrl+9 = wm:workspace:9
bind_insert = ctrl+cmd+1 = wm:move_to_workspace_follow:1
bind_insert = ctrl+cmd+2 = wm:move_to_workspace_follow:2
bind_insert = ctrl+cmd+3 = wm:move_to_workspace_follow:3
bind_insert = ctrl+cmd+4 = wm:move_to_workspace_follow:4
bind_insert = ctrl+cmd+5 = wm:move_to_workspace_follow:5
# Window tiling (Fn+Ctrl+arrows on a Mac)
bind_insert = ctrl+opt+Left = wm:tile:left
bind_insert = ctrl+opt+Right = wm:tile:right
bind_insert = ctrl+opt+Up = wm:tile:top
bind_insert = ctrl+opt+Down = wm:tile:bottom
bind_insert = ctrl+opt+Return = wm:tile:fill
bind_insert = ctrl+opt+f = wm:tile:fill
bind_insert = ctrl+opt+c = wm:tile:center
bind_insert = ctrl+opt+r = wm:tile:restore
bind_insert = ctrl+opt+u = wm:tile:top_left
bind_insert = ctrl+opt+i = wm:tile:top_right
bind_insert = ctrl+opt+j = wm:tile:bottom_left
bind_insert = ctrl+opt+k = wm:tile:bottom_right
# Screenshots: Cmd+Shift+3 the screen, Cmd+Shift+4 an area, add Ctrl to copy
bind_insert = cmd+shift+numbersign = spawn:mkdir -p "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots" && grim "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots/Screenshot-$(date +%Y%m%d-%H%M%S).png"
bind_insert = cmd+shift+dollar = spawn:box=$(slurp) || exit 0; mkdir -p "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots" && grim -g "$box" "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots/Screenshot-$(date +%Y%m%d-%H%M%S).png"
bind_insert = ctrl+cmd+shift+numbersign = spawn:grim - | wl-copy
bind_insert = ctrl+cmd+shift+dollar = spawn:box=$(slurp) || exit 0; grim -g "$box" - | wl-copy
bind_insert = Print = spawn:mkdir -p "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots" && grim "${XDG_PICTURES_DIR:-$HOME/Pictures}/Screenshots/Screenshot-$(date +%Y%m%d-%H%M%S).png"
# Media, volume and backlight
bind_insert = XF86AudioRaiseVolume = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; else pactl set-sink-volume @DEFAULT_SINK@ +5%; fi
bind_insert = XF86AudioLowerVolume = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; else pactl set-sink-volume @DEFAULT_SINK@ -5%; fi
bind_insert = XF86AudioMute = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; else pactl set-sink-mute @DEFAULT_SINK@ toggle; fi
bind_insert = XF86AudioMicMute = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; else pactl set-source-mute @DEFAULT_SOURCE@ toggle; fi
bind_insert = XF86AudioPlay = spawn:playerctl play-pause
bind_insert = XF86AudioPause = spawn:playerctl play-pause
bind_insert = XF86AudioNext = spawn:playerctl next
bind_insert = XF86AudioPrev = spawn:playerctl previous
bind_insert = XF86MonBrightnessUp = spawn:gluemac-backlight up
bind_insert = XF86MonBrightnessDown = spawn:gluemac-backlight down
